<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NOIR ATELIER — Digital Runway</title>
<meta name="description" content="NOIR ATELIER digital runway — a cinematic interactive fashion show. Six looks, one stage.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">

  <!-- Background layers (independent from the models) -->
  <div class="bg bg-base" id="bgBase"></div>
  <div class="bg bg-wipe" id="bgWipe"></div>

  <!-- Oversized editorial typography -->
  <div class="mega" id="megaWord" aria-hidden="true">NOIR</div>

  <!-- Top navigation -->
  <header class="nav">
    <a class="brand" href="#">NOIR&nbsp;ATELIER</a>
    <nav class="nav-links" aria-label="Main">
      <a href="#">Collections</a>
      <a href="#">Runway</a>
      <a href="#">About</a>
    </nav>
    <div class="nav-counter" aria-hidden="true"><span id="counterNow">01</span><span class="nav-counter-sep">/</span><span>06</span></div>
  </header>

  <!-- Runway stage -->
  <main class="stage" id="stage" aria-roledescription="carousel" aria-label="Fashion runway">
    <div class="model-wrap" id="modelA"><div class="shadow"></div><img id="imgA" alt=""></div>
    <div class="model-wrap" id="modelB"><div class="shadow"></div><img id="imgB" alt=""></div>

    <!-- Caption / collection info -->
    <section class="caption" id="caption">
      <p class="caption-kicker" id="capKicker">Look 01 — Streetwear</p>
      <h1 class="caption-title" id="capTitle">Noir Street</h1>
      <p class="caption-desc" id="capDesc">Premium black streetwear — oversized hoodie, cargo trouser, monochrome sneakers.</p>
      <a class="shop-btn" href="#" id="shopBtn">Shop the Look <span aria-hidden="true">→</span></a>
    </section>
  </main>

  <!-- Controls -->
  <div class="controls">
    <div class="dots" id="dots" role="tablist" aria-label="Looks"></div>
    <div class="controls-btns">
      <button class="ctl" id="prevBtn" aria-label="Previous look">←</button>
      <button class="ctl" id="playBtn" aria-label="Pause autoplay">❚❚</button>
      <button class="ctl" id="nextBtn" aria-label="Next look">→</button>
    </div>
  </div>

  <!-- Autoplay progress -->
  <div class="progress"><div class="progress-fill" id="progressFill"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="models.js"></script>
<script src="script.js"></script>
</body>
</html>
